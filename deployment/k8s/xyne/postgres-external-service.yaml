apiVersion: v1
kind: Service
metadata:
  name: xyne-db
  namespace: xyne
spec:
  clusterIP: None
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
      protocol: TCP
---
apiVersion: v1
kind: Endpoints
metadata:
  name: xyne-db
  namespace: xyne
subsets:
  - addresses:
      - ip: HOST_IP_PLACEHOLDER
    ports:
      - name: postgres
        port: 5432
        protocol: TCP
