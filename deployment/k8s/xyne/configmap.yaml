apiVersion: v1
kind: ConfigMap
metadata:
  name: xyne-config
  namespace: xyne
data:
  NODE_ENV: "production"
  DATABASE_HOST: "xyne-db"
  VESPA_HOST: "vespa"
  VESPA_FEED_PORT: "8080"
  VESPA_QUERY_PORT: "8081"
  EMBEDDING_MODEL: "bge-small-en-v1.5"
  REASONING: "true"
  METRICS_PORT: "3001"
  HOST: "http://localhost:3000"
  SYNC_SERVER_HOST: "xyne-app-sync"
  MAIN_SERVER_HOST: "xyne-app"
---
