apiVersion: v1
kind: Service
metadata:
  name: xyne-db
  namespace: xyne
spec:
  selector:
    app: xyne-db
  ports:
    - port: 5432
      targetPort: 5432
  clusterIP: None
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: xyne-db
  namespace: xyne
spec:
  serviceName: xyne-db
  replicas: 1
  selector:
    matchLabels:
      app: xyne-db
  template:
    metadata:
      labels:
        app: xyne-db
    spec:
      securityContext:
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
      initContainers:
        - name: init-permissions
          image: docker.io/library/busybox:latest
          imagePullPolicy: Never
          securityContext:
            runAsUser: 0
          command:
            - sh
            - -c
            - |
              chown -R 999:999 /var/lib/postgresql/data
              chmod -R 700 /var/lib/postgresql/data
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
      containers:
        - name: postgres
          image: postgis/postgis:15-3.5-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: xyne
            - name: POSTGRES_DB
              value: xyne
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: xyne-secrets
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_INITDB_ARGS
              value: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "xyne", "-d", "xyne"]
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "xyne", "-d", "xyne"]
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: 4000m
              memory: 8Gi
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        storageClassName: local-path
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 100Gi
