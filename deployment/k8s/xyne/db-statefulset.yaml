apiVersion: v1
kind: Service
metadata:
  name: xyne-db
  namespace: xyne
spec:
  selector:
    app: xyne-db
  ports:
    - port: 5432
      targetPort: 5432
  clusterIP: None
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: xyne-db
  namespace: xyne
spec:
  serviceName: xyne-db
  replicas: 1
  selector:
    matchLabels:
      app: xyne-db
  template:
    metadata:
      labels:
        app: xyne-db
    spec:
      securityContext:
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
      initContainers:
        - name: init-permissions
          image: busybox:latest
          securityContext:
            runAsUser: 0
          command:
            - sh
            - -c
            - |
              mkdir -p /bitnami/postgresql/data
              chown -R 1001:1001 /bitnami/postgresql/data
              chmod -R 700 /bitnami/postgresql/data
          volumeMounts:
            - name: postgres-data
              mountPath: /bitnami/postgresql/data
      containers:
        - name: postgres
          image: bitnami/postgresql:15
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRESQL_USERNAME
              value: xyne
            - name: POSTGRESQL_DATABASE
              value: xyne
            - name: POSTGRESQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: xyne-secrets
                  key: POSTGRES_PASSWORD
            - name: POSTGRESQL_EXTRA_FLAGS
              value: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
          volumeMounts:
            - name: postgres-data
              mountPath: /bitnami/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "xyne", "-d", "xyne"]
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "xyne", "-d", "xyne"]
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: 4000m
              memory: 8Gi
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        storageClassName: local-path
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 100Gi
