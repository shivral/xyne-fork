apiVersion: v1
kind: Service
metadata:
  name: vespa
  namespace: xyne
spec:
  clusterIP: None
  ports:
    - name: feed
      port: 8080
      targetPort: 8080
      protocol: TCP
    - name: query
      port: 8081
      targetPort: 8081
      protocol: TCP
    - name: config
      port: 19071
      targetPort: 19071
      protocol: TCP
---
apiVersion: v1
kind: Endpoints
metadata:
  name: vespa
  namespace: xyne
subsets:
  - addresses:
      - ip: HOST_IP_PLACEHOLDER
    ports:
      - name: feed
        port: 8080
        protocol: TCP
      - name: query
        port: 8081
        protocol: TCP
      - name: config
        port: 19071
        protocol: TCP
