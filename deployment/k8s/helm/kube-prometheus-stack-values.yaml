grafana:
  enabled: true
  adminPassword: "CHANGE_ME"
  service:
    type: ClusterIP
    port: 3000
  grafana.ini:
    server:
      root_url: "%(protocol)s://%(domain)s:%(http_port)s/grafana"
      serve_from_sub_path: true
  sidecar:
    datasources:
      enabled: true
      defaultDatasourcesEnabled: true
  persistence:
    enabled: true
    size: 10Gi
    storageClassName: ""
    existingClaim: null
  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
        - name: xyne
          orgId: 1
          folder: Xyne
          type: file
          disableDeletion: false
          options:
            path: /var/lib/grafana/dashboards/xyne
  dashboardsConfigMaps:
    xyne: xyne-grafana-dashboards
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 512Mi

prometheus:
  enabled: true
  prometheusSpec:
    retention: 30d
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: ""
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 50Gi
    additionalScrapeConfigs:
      - job_name: vespa-data-ingest
        scrape_interval: 10s
        metrics_path: /prometheus/v1/values
        static_configs:
          - targets:
              - HOST_IP_PLACEHOLDER:8080
      - job_name: xyne-app-metrics
        metrics_path: /metrics
        scrape_interval: 2s
        static_configs:
          - targets:
              - xyne-app.xyne.svc.cluster.local:3001
    resources:
      requests:
        cpu: 500m
        memory: 2Gi
      limits:
        cpu: 2000m
        memory: 8Gi

alertmanager:
  enabled: false

nodeExporter:
  enabled: true

kubeStateMetrics:
  enabled: true
