services:
  vespa:
    image: vespaengine/vespa:latest
    container_name: vespa
    hostname: vespa
    user: "${DOCKER_UID:-1000}:${DOCKER_GID:-1000}"
    ports:
      - "${VESPA_FEED_PORT:-8080}:8080"
      - "${VESPA_QUERY_PORT:-8081}:8081"
      - "19071:19071"
    volumes:
      - ${XYNE_DATA_DIR:-./data}/vespa-data:/opt/vespa/var
      - ../../server/vespa:/app/vespa
    networks:
      - xyne
    ulimits:
      nproc: 409600
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:19071/state/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "6"
    environment:
      - VESPA_CONFIGSERVER_JVMARGS=-Xms1g -Xmx2g -XX:+UseG1GC -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/opt/vespa/var/crash
      - VESPA_CONFIGPROXY_JVMARGS=-Xms512m -Xmx1g -XX:+UseG1GC
      - VESPA_CONTAINER_JVMARGS=-Xms4g -Xmx8g -XX:+UseG1GC -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/opt/vespa/var/crash -XX:MaxGCPauseMillis=200
      - VESPA_CONTENT_JVMARGS=-Xms4g -Xmx8g -XX:+UseG1GC -XX:MaxGCPauseMillis=500 -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/opt/vespa/var/crash
      - VESPA_SEARCHNODE_JVMARGS=-Xms4g -Xmx8g -XX:+UseG1GC -XX:MaxGCPauseMillis=500 -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/opt/vespa/var/crash
      - VESPA_LOGSERVER_JVMARGS=-Xms128m -Xmx256m -XX:+UseG1GC
      - VESPA_LOGS_JVMARGS=-Xms128m -Xmx256m -XX:+UseG1GC
      - VESPA_CLUSTER_CONTROLLER_JVMARGS=-Xms128m -Xmx256m -XX:+UseG1GC
      - VESPA_METRICS_JVMARGS=-Xms256m -Xmx512m -XX:+UseG1GC

  vespa-deploy:
    build:
      context: ../..
      dockerfile: deployment/portable/vespa-deploy/Dockerfile
    container_name: vespa-deploy
    depends_on:
      vespa:
        condition: service_started
    environment:
      - VESPA_CONFIGSERVERS=vespa
    volumes:
      - ${XYNE_DATA_DIR:-./data}/vespa-models:/app/vespa/models
    networks:
      - xyne
    restart: "no"

  xyne-db:
    image: postgis/postgis:15-3.5-alpine
    container_name: xyne-db
    environment:
      POSTGRES_USER: xyne
      POSTGRES_PASSWORD: xyne
      POSTGRES_DB: xyne
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    ports:
      - "${XYNE_DB_PORT:-5432}:5432"
    volumes:
      - ${XYNE_DATA_DIR:-./data}/postgres-data:/var/lib/postgresql/data
    networks:
      - xyne
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U xyne -d xyne"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "6"

  nginx:
    image: nginx:1.26-alpine
    container_name: xyne-nginx
    restart: unless-stopped
    ports:
      - "3000:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    environment:
      - NGINX_DOMAIN=${NGINX_DOMAIN:-localhost}
      - APP_PORT=${APP_PORT:-3001}
    networks:
      - xyne
    command: >
      /bin/sh -c "
      envsubst '$$NGINX_DOMAIN $$APP_PORT' < /etc/nginx/nginx.conf > /tmp/nginx.conf &&
      nginx -g 'daemon off;' -c /tmp/nginx.conf
      "

networks:
  xyne:
    external: true
